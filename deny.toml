# cargo-deny configuration — supply-chain checks for the dependency graph.
# Run locally with `cargo deny check`; CI runs the same on every push and PR.

[graph]
# Enable all features so feature-gated dependencies are checked too.
all-features = true

[advisories]
version = 2
# Deny crates with a known security advisory (RUSTSEC) or that have been yanked.
# `ignore` holds advisory IDs we've reviewed and consciously accept.
yanked = "deny"
ignore = [
    # rustls-webpki 0.103.15 and webpki-root-certs 1.0.9 (transitive via
    # reqwest -> rustls / rustls-platform-verifier) trust distrusted emSign
    # intermediates. Not exploitable here: the Hue bridge client sets
    # `danger_accept_invalid_certs(true)` and the health check uses plain HTTP
    # to localhost. Fixes 0.103.16 (2026-10-20 08:58 UTC) and 1.0.10
    # (2026-10-19 20:11 UTC) are inside the 168h cooldown until 2026-10-27
    # 08:58 UTC. Drop both entries and `cargo update -p rustls-webpki
    # -p webpki-root-certs` once it ends.
    # Tracked in https://github.com/henry40408/domus/issues/61
    "RUSTSEC-2026-0382",
    "RUSTSEC-2026-0383",
    # ctutils 0.4.2 (transitive via digest 0.11 and phc) is fixed in 0.4.4,
    # published 2026-10-23 01:04 UTC; the 168h cooldown ends 2026-10-30
    # 01:04 UTC. Upgrade to 0.4.4 and drop this entry then.
    # Tracked in https://github.com/henry40408/domus/issues/75
    "RUSTSEC-2026-0385",
]

[licenses]
version = 2
# Permissive / public-domain-equivalent licenses only. Verify the active set
# with `cargo deny list`; add a license here only after reviewing the crate.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate transitive versions are common; surface them as a warning, not a
# hard failure.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io is trusted; an unknown registry or any git source is rejected.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
