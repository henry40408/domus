# Every exclusion needs a reason; revisit when the behaviour changes.
test_tool = "nextest"

exclude_re = [
  # Start-up and shutdown wiring: it needs a real process, socket or signal.
  'replace resume_hue with \(\)',
  'replace prepare_data_dir -> ',
  'replace shutdown_signal with \(\)',
  'replace main with \(\)',
  'replace == with != in main',
  # Only burns argon2 time so unknown usernames cost as much as known ones; timing is not testable stably.
  'replace verify_dummy with \(\)',
  'replace warm_dummy with \(\)',
  # mDNS advertising needs a network and another host to observe it.
  'replace start -> Option<ServiceDaemon> with None',
  'replace stop with \(\)',
  # The Hue event loop needs a live bridge.
  'replace HueIntegration::run with \(\)',
  'replace HueIntegration::run_from with \(\)',
  # Equivalent: the default body is already an empty list.
  'replace Integration::light_sets -> Vec<LightSet> with vec!\[\]',
  # Equivalent: the sRGB curve is continuous at its knee, so both branches agree there.
  'replace > with >= in rgb_to_xy',
  # Equivalent: the check only differs for a route that leaves through loopback, which a test host cannot set up.
  'replace && with \|\| in local_ip',
  # Timing ties: a code or token that expires in the very second it is checked.
  'replace > with >= in AuthCodes::issue',
  'replace > with >= in AuthCodes::redeem',
  # First-tick timing: only moves when the first re-check happens, not what it reports.
  'replace \+ with - in run$',
  'replace \+ with - in events$',
]
