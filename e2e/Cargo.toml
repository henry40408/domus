[package]
name = "domus-e2e"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Regenerates the README screenshots against a fake Hue Bridge"

# Its own workspace, so the root's fmt/clippy/nextest/coverage never compile
# a WebDriver client.
[workspace]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
futures-util = { version = "0.3.34", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "json"] }
serde_json = "1.0.151"
tempfile = "3.26.0"
# Pinned like rdrs: 0.37.5 is inside the seven-day cooldown. `cdp-events` is
# needed for viewport and color-scheme emulation.
thirtyfour = { version = "=0.37.5", features = ["cdp-events"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }

[[bin]]
name = "screenshots"
path = "src/bin/screenshots.rs"
